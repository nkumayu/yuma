name: Build and deploy academic website

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Check site configuration and personal content
        run: bundle exec ruby bin/check-content.rb
      - name: Resolve GitHub Pages URL
        env:
          PAGES_REPOSITORY: ${{ github.repository }}
        run: bundle exec ruby bin/pages-config.rb _config.pages.yml
      - name: Build production website
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml,_config.pages.yml --trace
      - name: Verify generated pages and local links
        run: bundle exec ruby bin/check-site.rb _site
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
