services:
  jekyll:
    image: ruby:3.2-bookworm
    working_dir: /srv/jekyll
    command: sh -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --port 8080 --destination /tmp/academic-site --force_polling"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    environment:
      JEKYLL_ENV: development
      BUNDLE_APP_CONFIG: /tmp/bundle-config
      BUNDLE_PATH: /usr/local/bundle
volumes:
  bundle_cache:
